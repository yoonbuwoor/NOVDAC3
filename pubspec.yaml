name: droneatlas
publish_to: 'none'
description: Drone Atlas Academy — académie mobile pour maîtriser drone, photogrammétrie, géomatique, météo opérationnelle, capteurs et IA géospatiale.
version: 3.5.1+22

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.2.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/atlas_cards/
    - assets/icon/
