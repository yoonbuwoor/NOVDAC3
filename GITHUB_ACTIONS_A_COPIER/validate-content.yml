name: Validate DroneAtlas Content

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'content/**'
      - 'tool/validate_content.py'
      - '.github/workflows/validate-content.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'content/**'
      - 'tool/validate_content.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier les cours et le manifest
        run: python3 tool/validate_content.py
