[build]
  publish = "netlify/public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/assets/**"]

[[headers]]
  for = "/.netlify/functions/certification-api"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"


[[headers]]
  for = "/.netlify/functions/progress-api"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/.netlify/functions/account-delete-api"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/supprimer-compte"
  to = "/supprimer-compte.html"
  status = 200
